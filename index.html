<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤼 NBC - نجوم بلدية شيحاني</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background: #0f172a;
        }
        
        .wrestling-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #2d1b4e 70%, #1e293b 100%);
        }
        .wrestling-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(59, 130, 246, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
            z-index: 1;
        }
        .bg-icons {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.06;
            font-size: 100px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            pointer-events: none;
            user-select: none;
        }
        .bg-icons span {
            display: inline-block;
            animation: floatIcon 15s ease-in-out infinite;
            margin: 20px;
        }
        .bg-icons span:nth-child(1) { animation-delay: 0s; font-size: 130px; }
        .bg-icons span:nth-child(2) { animation-delay: 2.5s; font-size: 90px; }
        .bg-icons span:nth-child(3) { animation-delay: 5s; font-size: 160px; }
        .bg-icons span:nth-child(4) { animation-delay: 7.5s; font-size: 110px; }
        .bg-icons span:nth-child(5) { animation-delay: 10s; font-size: 140px; }
        .bg-icons span:nth-child(6) { animation-delay: 3.5s; font-size: 80px; }
        .bg-icons span:nth-child(7) { animation-delay: 8s; font-size: 120px; }
        .bg-icons span:nth-child(8) { animation-delay: 12s; font-size: 100px; }
        
        @keyframes floatIcon {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-25px) rotate(4deg) scale(1.04); }
            50% { transform: translateY(10px) rotate(-2deg) scale(0.96); }
            75% { transform: translateY(-18px) rotate(3deg) scale(1.02); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }
        
        .border-pattern {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #8b5cf6, #f59e0b, #8b5cf6, transparent);
            opacity: 0.3;
            z-index: 1;
        }
        .border-pattern.top { top: 0; }
        .border-pattern.bottom { bottom: 0; }
        
        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 600px;
            width: 100%;
            padding: 30px 28px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .club-header { text-align: center; margin-bottom: 5px; position: relative; }
        .club-logo { display: flex; justify-content: center; align-items: center; margin-bottom: 2px; position: relative; }
        .vibrant-icon {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: iconPulse 2s ease-in-out infinite;
        }
        .vibrant-icon::before {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #f59e0b, #ef4444, #8b5cf6, #f59e0b, #ef4444, #8b5cf6, #f59e0b);
            animation: fireSpin 3s linear infinite;
            filter: blur(2px);
            opacity: 0.6;
        }
        .vibrant-icon::after {
            content: '';
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #0f172a;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }
        @keyframes fireSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .icon-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
        .icon-stars { font-size: 20px; letter-spacing: 3px; animation: starTwinkle 1.5s ease-in-out infinite; color: #fbbf24; text-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
        @keyframes starTwinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.9); } }
        .icon-wrestle { font-size: 38px; animation: wrestleBounce 1.8s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5)); }
        @keyframes wrestleBounce { 0%, 100% { transform: translateY(0px) rotate(0deg); } 25% { transform: translateY(-5px) rotate(-5deg); } 75% { transform: translateY(-5px) rotate(5deg); } }
        .icon-nbc { font-size: 11px; font-weight: 900; color: #fbbf24; letter-spacing: 2px; margin-top: 1px; text-shadow: 0 0 15px rgba(251, 191, 36, 0.3); background: rgba(15, 23, 42, 0.8); padding: 0 10px; border-radius: 10px; }
        
        .club-name { font-size: 20px; font-weight: 800; color: #1e293b; margin-top: 6px; letter-spacing: 0.5px; line-height: 1.3; }
        .club-name .highlight { color: #8b5cf6; }
        .club-name .gold { color: #d97706; }
        .club-sub { font-size: 11px; color: #64748b; letter-spacing: 1.5px; font-weight: 600; margin-top: 1px; }
        .club-sub .accent { color: #8b5cf6; font-weight: 700; }
        .club-sub2 { font-size: 10px; color: #94a3b8; letter-spacing: 1px; margin-top: 1px; }
        
        .divider { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 12px; }
        .divider .line { flex: 1; height: 2px; background: linear-gradient(90deg, transparent, #8b5cf6, #f59e0b, #8b5cf6, transparent); }
        .divider .icon { font-size: 14px; color: #8b5cf6; }
        
        .ring-decoration { display: flex; justify-content: center; gap: 5px; margin: 3px 0 10px; }
        .ring-decoration .dot { width: 5px; height: 5px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #f59e0b); opacity: 0.5; }
        
        /* ===== الأزرار ===== */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
            letter-spacing: 1px;
            color: white;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); }
        .btn-primary:hover { box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4); }
        .btn-success { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }
        .btn-success:hover { box-shadow: 0 8px 25px rgba(22, 163, 74, 0.4); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .btn-warning:hover { box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4); }
        .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .btn-danger:hover { box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4); }
        .btn-secondary { background: linear-gradient(135deg, #64748b 0%, #475569 100%); }
        .btn-secondary:hover { box-shadow: 0 8px 25px rgba(100, 116, 139, 0.4); }
        .btn-disabled { background: #94a3b8; cursor: not-allowed; opacity: 0.6; }
        .btn-disabled:hover { transform: none; box-shadow: none; }
        .btn::before { margin-left: 8px; }
        
        .btn-submit { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 50%, #4c1d95 100%); color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 18px; transition: 0.3s; letter-spacing: 1px; padding: 14px; width: 100%; }
        .btn-submit::before { content: '🤼 '; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        /* ===== النماذج ===== */
        label { display: block; font-weight: 600; margin-top: 12px; color: #1e293b; font-size: 13px; }
        label .required { color: #ef4444; }
        label .label-icon { margin-left: 6px; }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: 0.3s;
            margin-top: 4px;
            background: #f8fafc;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #8b5cf6;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
        }
        textarea { min-height: 60px; resize: vertical; font-family: inherit; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
        .checkbox-group input { width: 18px; height: 18px; margin: 0; accent-color: #8b5cf6; }
        .checkbox-group label { margin: 0; font-weight: normal; font-size: 13px; color: #475569; }
        
        /* ===== التنبيهات ===== */
        .alert { padding: 12px 16px; border-radius: 10px; margin-top: 15px; display: none; font-size: 13px; }
        .alert-success { background: linear-gradient(135deg, #dcfce7, #bbf7d0); color: #166534; border: 1px solid #86efac; display: block; }
        .alert-error { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #991b1b; border: 1px solid #fca5a5; display: block; }
        .alert-info { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1e40af; border: 1px solid #93c5fd; display: block; }
        
        .reg-number-box {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            margin: 15px 0 5px;
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            border: 2px dashed #8b5cf6;
            display: none;
        }
        .reg-number-box .label { font-size: 12px; color: #64748b; font-weight: normal; display: block; margin-bottom: 3px; }
        .reg-number-box .number { color: #6d28d9; font-size: 24px; letter-spacing: 1px; }
        
        .counter { text-align: center; font-size: 13px; color: #94a3b8; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
        .counter span { font-weight: bold; color: #6d28d9; }
        
        .footer-text { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 8px; }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .sync-status { font-size: 12px; color: #64748b; text-align: center; margin-top: 5px; }
        .sync-status .success { color: #16a34a; }
        .sync-status .error { color: #ef4444; }
        .sync-status .loading { color: #8b5cf6; }
        
        @media (max-width: 480px) {
            .container { padding: 18px 14px; }
            .vibrant-icon { width: 70px; height: 70px; }
            .vibrant-icon::before { width: 64px; height: 64px; }
            .vibrant-icon::after { width: 50px; height: 50px; }
            .icon-wrestle { font-size: 28px; }
            .icon-stars { font-size: 14px; }
            .icon-nbc { font-size: 9px; }
            .club-name { font-size: 16px; }
        }

        /* ===== نافذة الكود السري ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 15px;
        }
        .modal-content {
            background: white;
            border-radius: 18px;
            max-width: 850px;
            width: 100%;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 14px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-radius: 18px 18px 0 0;
        }
        .modal-header h3 { margin: 0; color: #1e293b; font-size: 17px; }
        .modal-header .badge-count {
            background: #8b5cf6;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #94a3b8;
        }
        .modal-body {
            padding: 16px 20px 20px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-body .btn-group { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .modal-body .btn-group button { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; color: white; }
        .btn-copy-all { background: #3b82f6; }
        .btn-copy-json { background: #8b5cf6; }
        .btn-download-csv { background: #16a34a; }
        .btn-download-json { background: #f59e0b; }
        .btn-copy-sport { background: #64748b; }
        .btn-save-data { background: #8b5cf6; }

        .sport-table-wrapper {
            margin-bottom: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }
        .sport-table-header {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sport-table-header .sport-name { display: flex; align-items: center; gap: 8px; }
        .sport-table-header .sport-count { background: rgba(255,255,255,0.15); padding: 2px 12px; border-radius: 12px; font-size: 12px; font-weight: 400; }
        .sport-table-wrapper .table-wrap { overflow-x: auto; padding: 0; background: #f8fafc; }
        .sport-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            direction: rtl;
            min-width: 500px;
        }
        .sport-table th { background: #475569; color: white; padding: 5px 8px; text-align: center; font-weight: 600; font-size: 10px; white-space: nowrap; }
        .sport-table td { padding: 4px 8px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 12px; white-space: nowrap; }
        .sport-table tr:nth-child(even) td { background: #f1f5f9; }
        .sport-table .reg-num { font-weight: 700; color: #6d28d9; font-size: 12px; }
        .sport-table .delete-btn { background: #ef4444; color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; transition: 0.3s; }
        .sport-table .delete-btn:hover { background: #dc2626; }
        
        .category-badge { display: inline-block; padding: 1px 10px; border-radius: 10px; font-size: 10px; font-weight: 700; }
        .category-ecoliers { background: #dbeafe; color: #1e40af; }
        .category-cadets { background: #dcfce7; color: #166534; }
        .category-juniors { background: #fef9c3; color: #854d0e; }
        .category-u23 { background: #fce4ec; color: #9a1b3a; }
        .category-seniors { background: #e0e7ff; color: #3730a3; }
        .category-veterans { background: #f3e8ff; color: #6b21a8; }

        .modal-footer-note { font-size: 11px; color: #64748b; margin-top: 10px; text-align: center; }
        .copy-sport-btn { background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 4px; padding: 2px 12px; font-size: 11px; cursor: pointer; transition: 0.3s; }
        .copy-sport-btn:hover { background: rgba(255,255,255,0.35); }

        /* ===== نافذة تسجيل الدخول ===== */
        .login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }
        .login-box {
            background: white;
            border-radius: 24px;
            padding: 35px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
            max-height: 95vh;
            overflow-y: auto;
        }
        .login-box .icon { font-size: 48px; margin-bottom: 8px; }
        .login-box h2 { color: #1e293b; margin-bottom: 4px; font-size: 20px; }
        .login-box .sub-text { color: #64748b; font-size: 13px; margin-bottom: 15px; }
        .login-box .input-group { margin-bottom: 10px; text-align: right; }
        .login-box .input-group label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 4px; }
        .login-box .input-group input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            background: #f8fafc;
            transition: 0.3s;
        }
        .login-box .input-group input:focus {
            border-color: #8b5cf6;
            outline: none;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
            background: white;
        }
        .login-box .error-msg { color: #ef4444; font-size: 13px; margin-top: 6px; display: none; padding: 8px 12px; background: #fef2f2; border-radius: 8px; border: 1px solid #fca5a5; }
        .login-box .link-btn { display: inline-block; margin-top: 10px; font-size: 13px; color: #8b5cf6; cursor: pointer; text-decoration: underline; background: none; border: none; }
        .login-box .link-btn:hover { color: #6d28d9; }
        .login-box .close-btn { background: none; border: none; font-size: 14px; color: #94a3b8; cursor: pointer; margin-top: 10px; }
        .login-box .close-btn:hover { color: #475569; }

        /* ===== صفحة اللاعب الشخصية (مثل التطبيق) ===== */
        .player-dashboard { padding: 10px 0; }
        .player-dashboard .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin: 15px 0 10px;
            border-right: 4px solid #8b5cf6;
            padding-right: 10px;
        }
        .player-dashboard .info-card {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
        }
        .player-dashboard .info-card .label { font-size: 11px; color: #94a3b8; font-weight: 600; }
        .player-dashboard .info-card .value { font-size: 15px; font-weight: 700; color: #1e293b; }
        
        /* ===== جدول الغيابات ===== */
        .absence-table-wrapper {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .absence-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            min-width: 700px;
            direction: rtl;
        }
        .absence-table th {
            background: #1e293b;
            color: white;
            padding: 6px 4px;
            text-align: center;
            font-weight: 600;
            font-size: 10px;
            white-space: nowrap;
        }
        .absence-table th .month-name {
            display: block;
            font-size: 9px;
            color: #94a3b8;
            font-weight: 400;
        }
        .absence-table td {
            padding: 4px 3px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            font-size: 10px;
            font-weight: 600;
        }
        .absence-table tr:nth-child(even) td { background: #f8fafc; }
        .absence-table .day-name {
            font-size: 9px;
            font-weight: 400;
            color: #64748b;
            display: block;
        }
        
        /* ===== ألوان الحضور والغياب ===== */
        .absence-table .status-present { background: #dcfce7 !important; color: #166534; border-bottom: 2px solid #16a34a; }
        .absence-table .status-absent { background: #fee2e2 !important; color: #991b1b; border-bottom: 2px solid #dc2626; }
        .absence-table .status-excused { background: #fef9c3 !important; color: #854d0e; border-bottom: 2px solid #d97706; }
        .absence-table .status-sick { background: #fce4ec !important; color: #9a1b3a; border-bottom: 2px solid #9a1b3a; }
        .absence-table .status-empty { background: #f1f5f9 !important; color: #94a3b8; }
        
        /* ===== وسيلة الإيضاح ===== */
        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 8px 12px;
            background: #f1f5f9;

<script>
    // ============================================================
    // 🔑 إعدادات الكود السري
    // ============================================================
    let SECRET_CODE = "2025";
    const RECOVERY_EMAIL = "faresbarca069@gmail.com";
    let generatedVerificationCode = null;
    let isCodeVisible = false;
    let currentPlayer = null;
    
    // ============================================================
    // 🌐 رابط Google Apps Script
    // ============================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbzAzZliXOYx6ITX9gd9Wxqvmwo4Wj-5mfYujA_kmjjb63ZIcntZ1G0l8G54LGlKQRYV5Q/exec';
    
    // ============================================================
    // 1. دوال التخزين
    // ============================================================
    
    function getAthletes() {
        try {
            const data = localStorage.getItem('athletes');
            return data ? JSON.parse(data) : [];
        } catch(e) {
            return [];
        }
    }
    
    function saveAthletesLocally(athletes) {
        try {
            localStorage.setItem('athletes', JSON.stringify(athletes));
            updateCounter();
            return true;
        } catch(e) {
            return false;
        }
    }
    
    function addAthlete(athlete) {
        const athletes = getAthletes();
        athletes.push(athlete);
        return saveAthletesLocally(athletes);
    }
    
    function deleteAthleteById(id) {
        let athletes = getAthletes();
        athletes = athletes.filter(a => a.id !== id);
        return saveAthletesLocally(athletes);
    }
    
    function updateCounter() {
        const athletes = getAthletes();
        const counter = document.getElementById('counter');
        if (counter) counter.textContent = athletes.length;
    }
    
    function getPlayerByEmail(email) {
        const athletes = getAthletes();
        return athletes.find(a => a.email && a.email.toLowerCase() === email.toLowerCase());
    }
    
    // ============================================================
    // 2. دالة حساب الفئة العمرية حسب UWW
    // ============================================================
    
    function getUWWAgeCategory(age) {
        if (age >= 14 && age <= 15) {
            return { name: "Ecoliers", arabic: "تلاميذ", css: "category-ecoliers" };
        } else if (age >= 16 && age <= 17) {
            return { name: "Cadets", arabic: "أشبال", css: "category-cadets" };
        } else if (age >= 18 && age <= 20) {
            return { name: "Juniors", arabic: "ناشئون", css: "category-juniors" };
        } else if (age >= 19 && age <= 23) {
            return { name: "U23", arabic: "أقل من 23 سنة", css: "category-u23" };
        } else if (age >= 35) {
            return { name: "Vétérans", arabic: "مخضرمون", css: "category-veterans" };
        } else {
            return { name: "Seniors", arabic: "كبار", css: "category-seniors" };
        }
    }
    
    // ============================================================
    // 3. أيام الأسبوع والأشهر
    // ============================================================
    
    const dayNames = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
    const monthNames = ['جانفي', 'فيفري', 'مارس', 'أفريل', 'ماي', 'جوان', 'جويلية', 'أوت', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
    
    function getDaysInMonth(year, month) {
        return new Date(year, month + 1, 0).getDate();
    }
    
    function getFirstDayOfMonth(year, month) {
        return new Date(year, month, 1).getDay();
    }
    
    // ============================================================
    // 4. بيانات البطولات
    // ============================================================
    
    function getTournaments() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        
        return [
            {
                title: "بطولة الجزائر الوطنية للمصارعة",
                date: `${year}-${month}-${parseInt(day) + 15 > 30 ? 15 : parseInt(day) + 15}`,
                location: "قاعة البريد المركزي - الجزائر العاصمة",
                type: "national",
                typeText: "🇩🇿 وطنية"
            },
            {
                title: "بطولة ولاية الجزائر للمصارعة",
                date: `${year}-${month}-${parseInt(day) + 5 > 30 ? 5 : parseInt(day) + 5}`,
                location: "قاعة سيدي امحمد - الجزائر",
                type: "regional",
                typeText: "🏛️ ولائية"
            },
            {
                title: "كأس الجزائر للمصارعة",
                date: `${year}-${month}-${parseInt(day) + 25 > 30 ? 25 : parseInt(day) + 25}`,
                location: "قاعة الميناء - الجزائر",
                type: "national",
                typeText: "🇩🇿 وطنية"
            },
            {
                title: "بطولة شرق الجزائر للمصارعة",
                date: `${year}-${month}-${parseInt(day) + 10 > 30 ? 10 : parseInt(day) + 10}`,
                location: "قاعة عنابة - عنابة",
                type: "regional",
                typeText: "🏛️ ولائية"
            }
        ];
    }
    
    // ============================================================
    // 5. دوال التنقل بين الصفحات
    // ============================================================
    
    function showMainPage() {
        document.getElementById('mainPage').style.display = 'block';
        document.getElementById('registerPage').style.display = 'none';
        document.getElementById('playerPage').style.display = 'none';
        document.getElementById('tournamentsPage').style.display = 'none';
        updateCounter();
    }
    
    function showRegisterForm() {
        document.getElementById('mainPage').style.display = 'none';
        document.getElementById('registerPage').style.display = 'block';
        document.getElementById('playerPage').style.display = 'none';
        document.getElementById('tournamentsPage').style.display = 'none';
        document.getElementById('result').className = 'alert';
        document.getElementById('result').style.display = 'none';
        document.getElementById('regNumberBox').style.display = 'none';
    }
    
    function showPlayerPage(player) {
        currentPlayer = player;
        document.getElementById('mainPage').style.display = 'none';
        document.getElementById('registerPage').style.display = 'none';
        document.getElementById('playerPage').style.display = 'block';
        document.getElementById('tournamentsPage').style.display = 'none';
        renderPlayerDashboard(player);
    }
    
    function showTournaments() {
        document.getElementById('mainPage').style.display = 'none';
        document.getElementById('registerPage').style.display = 'none';
        document.getElementById('playerPage').style.display = 'none';
        document.getElementById('tournamentsPage').style.display = 'block';
        renderTournaments();
    }
    
    function logoutPlayer() {
        currentPlayer = null;
        showMainPage();
    }
    
    // ============================================================
    // 6. عرض لوحة اللاعب الشخصية (للقراءة فقط للاعب)
    // ============================================================
    
    function renderPlayerDashboard(player) {
        const dashboard = document.getElementById('playerDashboard');
        
        const absences = player.absences || {};
        const notes = player.notes || [];
        const now = new Date();
        const currentYear = now.getFullYear();
        
        let html = `
            <div style="text-align:center; margin-bottom:15px;">
                <span style="font-size:40px;">🤼</span>
                <h3 style="color:#1e293b; margin:5px 0;">${player.fullName}</h3>
                <span style="font-size:13px; color:#8b5cf6; font-weight:600;">${player.regNumber}</span>
                <span style="display:block; font-size:12px; color:#94a3b8;">${player.sport || 'مصارعة'}</span>
            </div>
            
            <div class="readonly-message">
                <span class="icon">👁️</span> يمكنك مشاهدة بياناتك وملاحظات المدرب فقط. لا يمكنك التعديل.
            </div>
            
            <div class="section-title">📋 معلومات شخصية</div>
            <div class="info-card">
                <div class="label">📧 البريد الإلكتروني</div>
                <div class="value">${player.email}</div>
            </div>
            <div class="info-card">
                <div class="label">📅 تاريخ الميلاد</div>
                <div class="value">${player.birthDate || 'غير محدد'}</div>
            </div>
            <div class="info-card">
                <div class="label">📞 رقم الهاتف</div>
                <div class="value">${player.phone || 'غير محدد'}</div>
            </div>
            <div class="info-card">
                <div class="label">🏷️ الفئة (UWW)</div>
                <div class="value"><span class="category-badge ${player.categoryCSS || 'category-seniors'}">${player.category || 'Seniors'}</span></div>
            </div>
            
            <div class="section-title">📅 جدول الغيابات - السنة ${currentYear}</div>
            
            <div class="legend">
                <span class="item"><span class="color-box present"></span> حاضر</span>
                <span class="item"><span class="color-box absent"></span> غائب</span>
                <span class="item"><span class="color-box excused"></span> معذور</span>
                <span class="item"><span class="color-box sick"></span> مريض</span>
                <span class="item"><span class="color-box empty"></span> لم يُحدد</span>
            </div>
        `;
        
        // جدول الغيابات (للقراءة فقط)
        html += `<div class="absence-table-wrapper"><table class="absence-table">`;
        html += `<thead><tr><th style="min-width:60px;">الأسبوع</th>`;
        dayNames.forEach(day => {
            html += `<th>${day}</th>`;
        });
        html += `</tr></thead><tbody>`;
        
        const startDate = new Date(currentYear, 0, 1);
        const endDate = new Date(currentYear, 11, 31);
        let currentDate = new Date(startDate);
        let weekNumber = 1;
        
        while (currentDate <= endDate) {
            const weekStart = new Date(currentDate);
            html += `<tr><td style="font-weight:700; font-size:10px; color:#64748b;">${weekNumber}</td>`;
            
            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(currentDate);
                if (dayDate > endDate) {
                    html += `<td class="status-empty">-</td>`;
                    continue;
                }
                
                const dateKey = dayDate.toISOString().split('T')[0];
                const status = absences[dateKey] || 'empty';
                
                let statusClass = 'status-empty';
                let statusText = '●';
                
                if (status === 'present') {
                    statusClass = 'status-present';
                    statusText = '✓';
                } else if (status === 'absent') {
                    statusClass = 'status-absent';
                    statusText = '✗';
                } else if (status === 'excused') {
                    statusClass = 'status-excused';
                    statusText = '◉';
                } else if (status === 'sick') {
                    statusClass = 'status-sick';
                    statusText = '✦';
                }
                
                const dayNum = dayDate.getDate();
                html += `<td class="${statusClass}" title="${dayNum} ${monthNames[dayDate.getMonth()]} - ${statusText}">${dayNum}</td>`;
                
                currentDate.setDate(currentDate.getDate() + 1);
            }
            
            html += `</tr>`;
            weekNumber++;
            currentDate = new Date(weekStart);
            currentDate.setDate(currentDate.getDate() + 7);
        }
        
        html += `</tbody></table></div>`;
        html += `<div style="text-align:center; margin-top:8px; font-size:12px; color:#94a3b8;">👆 اضغط على أي يوم لعرض التفاصيل (للقراءة فقط)</div>`;
        
        // ملاحظات المدرب (للقراءة فقط)
        html += `<div class="section-title">📝 ملاحظات المدرب</div>`;
        
        if (notes.length === 0) {
            html += `<div class="empty-state"><span class="icon">📝</span>لا توجد ملاحظات</div>`;
        } else {
            notes.forEach(note => {
                html += `
                    <div class="note-item">
                        <div class="note-header">
                            <span class="note-coach">👨‍🏫 المدرب</span>
                            <span class="note-date">${note.date || ''}</span>
                            <span class="readonly-badge">🔒 للقراءة فقط</span>
                        </div>
                        <div class="note-text">${note.text || ''}</div>
                    </div>
                `;
            });
        }
        
        dashboard.innerHTML = html;
        
        // إضافة حدث النقر على أيام الجدول لعرض التفاصيل
        document.querySelectorAll('.absence-table td:not(.status-empty)').forEach(cell => {
            cell.style.cursor = 'pointer';
            cell.addEventListener('click', function() {
                const dateText = this.getAttribute('title') || 'تاريخ غير محدد';
                alert(`📅 ${dateText}\n\n🔒 هذه المعلومات للقراءة فقط.\nلا يمكنك تعديلها.`);
            });
        });
    }

    const form = document.getElementById('registerForm');

    const regNumberSpan = document.getElementById('regNumber');
    
    updateCounter();

    console.log('🌐 API URL:', API_URL);
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = '⏳ جاري التسجيل... <span class="loading-spinner"></span>';
        
        const fullName = document.getElementById('fullName').value.trim();
        const birthDate = document.getElementById('birthDate').value;
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const sport = document.getElementById('sport').value;
        const consent = document.getElementById('parentConsent').checked;
        
        resultDiv.className = 'alert';
        resultDiv.style.display = 'none';
        regNumberBox.style.display = 'none';
        
        if (!fullName || !birthDate || !phone || !email || !password) {
            showError('❌ الرجاء ملء جميع الحقول المطلوبة (*)');
            enableButton();
            return;
        }
        
        if (password.length < 4) {
            showError('❌ الرقم السري يجب أن يكون 4 أحرف على الأقل');
            enableButton();
            return;
        }
        
        if (!/^[0-9]{10}$/.test(phone)) {
            showError('❌ رقم الهاتف يجب أن يكون 10 أرقام');
            enableButton();
            return;
        }
        
        if (!consent) {
            showError('❌ يجب الموافقة على شروط التسجيل');
            enableButton();
            return;
        }
        
        const existingPlayer = getPlayerByEmail(email);
        if (existingPlayer) {
            showError('❌ هذا البريد الإلكتروني مسجل بالفعل! يرجى استخدام بريد آخر.');
            enableButton();
            return;
        }
        
        const birth = new Date(birthDate);
        const today = new Date();
        let age = today.getFullYear() - birth.getFullYear();
        const monthDiff = today.getMonth() - birth.getMonth();
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
            age--;
        }
        
        const category = getUWWAgeCategory(age);
        
        const year = new Date().getFullYear();
        const random = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
        const regNumber = `REG-${year}-${random}`;
        
        const athleteData = {
            id: Date.now() + Math.random() * 1000,
            fullName: fullName,
            birthDate: birthDate,
            age: age,
            phone: phone,
            email: email,
            password: password,

            category: category.name,
            categoryArabic: category.arabic,
            categoryCSS: category.css,
            consent: consent,
            regNumber: regNumber,
            registrationDate: new Date().toISOString(),
            absences: {},
            notes: []
        };
        
        const success = addAthlete(athleteData);

            showSuccess(`✅ تم تسجيل المصارع بنجاح!<br>🤼 ${fullName} | 🏷️ ${category.name} (${category.arabic}) | ${sport}`);

                alert(`🎉 مرحباً ${fullName}!\n\n🆔 رقم المصارع: ${regNumber}\n📧 بريدك الإلكتروني: ${email}\n🔑 رقمك السري: ${password}\n\n📌 استخدم هذه المعلومات لتسجيل الدخول إلى حسابك الشخصي.`);

    // ============================================================
    
    function syncToCloud(data) {
        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if (result.success) {
                console.log('✅ تم الحفظ في السحابة بنجاح');
            } else {
                console.error('❌ فشل الحفظ في السحابة:', result.error);
            }
        })
        .catch(error => {
            console.error('❌ خطأ في الاتصال بالسحابة:', error);
        });
    }
    
    function syncWithCloud() {
        const statusDiv = document.getElementById('syncStatus');
        statusDiv.innerHTML = '<span class="loading">⏳ جاري المزامنة مع السحابة...</span>';
        
        fetch(API_URL + '?action=get')
        .then(response => response.json())
        .then(result => {
            if (result.success && result.data) {
                const cloudData = result.data;
                const localData = getAthletes();
                const existingEmails = new Set(localData.map(a => a.email));
                let newCount = 0;
                
                cloudData.forEach(cloudItem => {
                    if (!existingEmails.has(cloudItem['البريد الإلكتروني'])) {
                        const newAthlete = {
                            id: Date.now() + Math.random() * 1000 + newCount,
                            fullName: cloudItem['الاسم الكامل'] || cloudItem['الاسم'] || '',
                            birthDate: cloudItem['تاريخ الميلاد'] || '',
                            age: parseInt(cloudItem['العمر']) || 0,
                            phone: cloudItem['رقم الهاتف'] || '',
                            email: cloudItem['البريد الإلكتروني'] || '',
                            password: '1234',
                            sport: cloudItem['الرياضة'] || '',
                            category: cloudItem['الفئة (UWW)'] || 'Seniors',
                            categoryArabic: '',
                            categoryCSS: 'category-seniors',
                            consent: cloudItem['موافقة ولي الأمر'] === 'نعم',
                            regNumber: cloudItem['رقم المصارع'] || `REG-${Date.now()}-${newCount}`,
                            registrationDate: cloudItem['تاريخ التسجيل'] || new Date().toISOString(),
                            absences: {},
                            notes: []
                        };
                        
                        const age = newAthlete.age;
                        const cat = getUWWAgeCategory(age);
                        newAthlete.category = cat.name;
                        newAthlete.categoryArabic = cat.arabic;
                        newAthlete.categoryCSS = cat.css;
                        
                        localData.push(newAthlete);
                        newCount++;
                    }
                });
                
                if (newCount > 0) {
                    saveAthletesLocally(localData);
                    statusDiv.innerHTML = `<span class="success">✅ تمت المزامنة بنجاح! تم إضافة ${newCount} لاعب جديد من السحابة.</span>`;
                } else {
                    statusDiv.innerHTML = `<span class="success">✅ تمت المزامنة بنجاح! لا توجد بيانات جديدة.</span>`;
                }
                
                updateCounter();
            } else {
                statusDiv.innerHTML = `<span class="error">❌ فشل جلب البيانات من السحابة: ${result.error || 'خطأ غير معروف'}</span>`;
            }
        })
        .catch(error => {
            statusDiv.innerHTML = `<span class="error">❌ خطأ في الاتصال بالسحابة: ${error.message}</span>`;
        });
    }

                    </div>
                    <div class="error-msg" id="passwordError" style="color:#ef4444; font-size:13px; margin-top:6px; display:none; padding:8px 12px; background:#fef2f2; border-radius:8px; border:1px solid #fca5a5;">❌ الكود السري غير صحيح!</div>

                    <button class="btn btn-secondary" onclick="closePasswordDialog()" style="margin-top:5px;">إلغاء</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        
        const inputs = document.querySelectorAll('.code-box');
        inputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                this.value = this.value.toUpperCase();
                if (this.value.length === 1) {
                    this.classList.add('filled');
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                } else {
                    this.classList.remove('filled');
                }
                document.getElementById('passwordError').style.display = 'none';
            });
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
                if (e.key === 'Enter') {
                    verifyCodeFromBoxes();
                }
            });
            
            input.addEventListener('keypress', function(e) {
                const char = String.fromCharCode(e.which);
                if (!/^[a-zA-Z0-9]$/.test(char)) {
                    e.preventDefault();
                }
            });
        });
        
        setTimeout(() => {
            if (inputs[0]) inputs[0].focus();
        }, 300);
    }
    
    function getCodeFromBoxes() {
        const inputs = document.querySelectorAll('.code-box');
        let code = '';
        inputs.forEach(input => {
            code += input.value.trim();
        });
        return code;
    }
    
    function clearCodeBoxes() {
        const inputs = document.querySelectorAll('.code-box');
        inputs.forEach(input => {
            input.value = '';
            input.classList.remove('filled');
            input.classList.remove('error');
            input.type = 'password';
        });
        isCodeVisible = false;
        const toggleBtn = document.getElementById('toggleCodeBtn');
        if (toggleBtn) {
            toggleBtn.innerHTML = '👁️ إظهار الكود';
            toggleBtn.classList.remove('active');
        }
        if (inputs[0]) inputs[0].focus();
    }
    
    function verifyCodeFromBoxes() {
        const code = getCodeFromBoxes();
        const error = document.getElementById('passwordError');
        
        if (code === SECRET_CODE) {
            closePasswordDialog();
            exportData();

            inputs.forEach(input => {
                input.classList.add('error');
                setTimeout(() => input.classList.remove('error'), 500);
            });
            setTimeout(clearCodeBoxes, 600);
        }
    }

    function saveDataToFile() {
        const athletes = getAthletes();
        if (athletes.length === 0) {
            alert('⚠️ لا توجد بيانات للحفظ!');
            return;
        }
        const dataStr = JSON.stringify(athletes, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `المصارعين_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
        alert('✅ تم حفظ البيانات بنجاح!');
    }

        tables.forEach((table, idx) => {
            const header = table.closest('.sport-table-wrapper')?.querySelector('.sport-table-header .sport-name')?.textContent || `الجدول ${idx+1}`;
            allText += `\n=== ${header.trim()} ===\n`;
            allText += 'رقم المصارع\tالاسم\tالبريد\tالفئة (UWW)\tالعمر\n';
            const rows = table.querySelectorAll('tbody tr');
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                allText += `${cells[1]?.textContent.trim() || '-'}\t${cells[2]?.textContent.trim() || '-'}\t${cells[3]?.textContent.trim() || '-'}\t${cells[4]?.textContent.trim() || '-'}\t${cells[5]?.textContent.trim() || '-'}\n`;
            });
        });
        copyText(allText, '✅ تم نسخ جميع الجداول بنجاح!');
    }
    
    function copyAllJSON() {
        const data = window._athletesData || [];
        if (data.length === 0) { alert('⚠️ لا توجد بيانات'); return; }
        const cleanData = data.map(a => ({
            رقم_المصارع: a.regNumber || '-',
            الاسم: a.fullName || '-',
            البريد: a.email || '-',
            الفئة_UWW: a.category || 'Seniors',
            العمر: a.age || '-'
        }));
        copyText(JSON.stringify(cleanData, null, 2), '✅ تم نسخ JSON بنجاح!');
    }
    
    function copyText(text, successMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => alert(successMsg)).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }
    
    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); alert('✅ تم النسخ بنجاح!'); } catch(e) { alert('❌ فشل النسخ'); }
        document.body.removeChild(textarea);
    }
    
    function downloadAllCSV() {
        const groups = window._groupsData || {};
        const sportNames = Object.keys(groups);
        if (sportNames.length === 0) { alert('⚠️ لا توجد بيانات'); return; }
        let csv = '';
        sportNames.forEach(sport => {
            const items = groups[sport];
            csv += `\n"${sport}"\n`;
            csv += '"رقم المصارع","الاسم","البريد","الفئة (UWW)","العمر"\n';
            items.forEach(a => {
                csv += `"${a.regNumber || '-'}","${a.fullName || '-'}","${a.email || '-'}","${a.category || 'Seniors'}","${a.age || '-'}"\n`;
            });
        });
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `المصارعين_NBC_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
        alert('✅ تم تحميل CSV بنجاح!');
    }
    
    function downloadAllJSON() {
        const data = window._athletesData || [];
        if (data.length === 0) { alert('⚠️ لا توجد بيانات'); return; }
        const cleanData = data.map(a => ({

            البريد: a.email || '-',
            الفئة_UWW: a.category || 'Seniors',
            العمر: a.age || '-'
        }));
        const blob = new Blob([JSON.stringify(cleanData, null, 2)], { type: 'application/json;charset=utf-8;' });

        link.download = `المصارعين_NBC_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
        alert('✅ تم تحميل JSON بنجاح!');
    }
    
    // ============================================================
    // 13. كشف الفئة تلقائياً

    document.getElementById('birthDate').addEventListener('change', function() {
        const birth = this.value;
        if (!birth) return;
        const birthDate = new Date(birth);
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const monthDiff = today.getMonth() - birthDate.getMonth();
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
            age--;
        }
        const category = getUWWAgeCategory(age);
        console.log(`📌 العمر: ${age} سنة → الفئة: ${category.name} (${category.arabic})`);
    });
