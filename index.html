<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤼 NBC - نجوم بلدية شيحاني</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background: #0f172a;
        }
        .wrestling-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #2d1b4e 70%, #1e293b 100%);
        }
        .wrestling-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(59, 130, 246, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
            z-index: 1;
        }
        .bg-icons {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.06;
            font-size: 100px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            pointer-events: none;
            user-select: none;
        }
        .bg-icons span {
            display: inline-block;
            animation: floatIcon 15s ease-in-out infinite;
            margin: 20px;
        }
        .bg-icons span:nth-child(1) { animation-delay: 0s; font-size: 130px; }
        .bg-icons span:nth-child(2) { animation-delay: 2.5s; font-size: 90px; }
        .bg-icons span:nth-child(3) { animation-delay: 5s; font-size: 160px; }
        .bg-icons span:nth-child(4) { animation-delay: 7.5s; font-size: 110px; }
        .bg-icons span:nth-child(5) { animation-delay: 10s; font-size: 140px; }
        .bg-icons span:nth-child(6) { animation-delay: 3.5s; font-size: 80px; }
        .bg-icons span:nth-child(7) { animation-delay: 8s; font-size: 120px; }
        .bg-icons span:nth-child(8) { animation-delay: 12s; font-size: 100px; }
        @keyframes floatIcon {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-25px) rotate(4deg) scale(1.04); }
            50% { transform: translateY(10px) rotate(-2deg) scale(0.96); }
            75% { transform: translateY(-18px) rotate(3deg) scale(1.02); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }
        .border-pattern {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #8b5cf6, #f59e0b, #8b5cf6, transparent);
            opacity: 0.3;
            z-index: 1;
        }
        .border-pattern.top { top: 0; }
        .border-pattern.bottom { bottom: 0; }
        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 600px;
            width: 100%;
            padding: 30px 28px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .club-header { text-align: center; margin-bottom: 5px; position: relative; }
        .club-logo { display: flex; justify-content: center; align-items: center; margin-bottom: 2px; position: relative; }
        .vibrant-icon {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: iconPulse 2s ease-in-out infinite;
        }
        .vibrant-icon::before {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #f59e0b, #ef4444, #8b5cf6, #f59e0b, #ef4444, #8b5cf6, #f59e0b);
            animation: fireSpin 3s linear infinite;
            filter: blur(2px);
            opacity: 0.6;
        }
        .vibrant-icon::after {
            content: '';
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #0f172a;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }
        @keyframes fireSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .icon-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
        .icon-stars { font-size: 20px; letter-spacing: 3px; animation: starTwinkle 1.5s ease-in-out infinite; color: #fbbf24; text-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
        @keyframes starTwinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.9); } }
        .icon-wrestle { font-size: 38px; animation: wrestleBounce 1.8s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5)); }
        @keyframes wrestleBounce { 0%, 100% { transform: translateY(0px) rotate(0deg); } 25% { transform: translateY(-5px) rotate(-5deg); } 75% { transform: translateY(-5px) rotate(5deg); } }
        .icon-nbc { font-size: 11px; font-weight: 900; color: #fbbf24; letter-spacing: 2px; margin-top: 1px; text-shadow: 0 0 15px rgba(251, 191, 36, 0.3); background: rgba(15, 23, 42, 0.8); padding: 0 10px; border-radius: 10px; }
        .club-name { font-size: 20px; font-weight: 800; color: #1e293b; margin-top: 6px; letter-spacing: 0.5px; line-height: 1.3; }
        .club-name .highlight { color: #8b5cf6; }
        .club-name .gold { color: #d97706; }
        .club-sub { font-size: 11px; color: #64748b; letter-spacing: 1.5px; font-weight: 600; margin-top: 1px; }
        .club-sub .accent { color: #8b5cf6; font-weight: 700; }
        .club-sub2 { font-size: 10px; color: #94a3b8; letter-spacing: 1px; margin-top: 1px; }
        .divider { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 12px; }
        .divider .line { flex: 1; height: 2px; background: linear-gradient(90deg, transparent, #8b5cf6, #f59e0b, #8b5cf6, transparent); }
        .divider .icon { font-size: 14px; color: #8b5cf6; }
        .ring-decoration { display: flex; justify-content: center; gap: 5px; margin: 3px 0 10px; }
        .ring-decoration .dot { width: 5px; height: 5px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #f59e0b); opacity: 0.5; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
            letter-spacing: 1px;
            color: white;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); }
        .btn-primary:hover { box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4); }
        .btn-success { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }
        .btn-success:hover { box-shadow: 0 8px 25px rgba(22, 163, 74, 0.4); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .btn-warning:hover { box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4); }
        .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .btn-danger:hover { box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4); }
        .btn-secondary { background: linear-gradient(135deg, #64748b 0%, #475569 100%); }
        .btn-secondary:hover { box-shadow: 0 8px 25px rgba(100, 116, 139, 0.4); }
        .btn::before { margin-left: 8px; }
        .btn-submit {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 50%, #4c1d95 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
            transition: 0.3s;
            letter-spacing: 1px;
            padding: 14px;
            width: 100%;
        }
        .btn-submit::before { content: '🤼 '; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        label { display: block; font-weight: 600; margin-top: 12px; color: #1e293b; font-size: 13px; }
        label .required { color: #ef4444; }
        label .label-icon { margin-left: 6px; }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: 0.3s;
            margin-top: 4px;
            background: #f8fafc;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #8b5cf6;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
        }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
        .checkbox-group input { width: 18px; height: 18px; margin: 0; accent-color: #8b5cf6; }
        .checkbox-group label { margin: 0; font-weight: normal; font-size: 13px; color: #475569; }
        .alert { padding: 12px 16px; border-radius: 10px; margin-top: 15px; display: none; font-size: 13px; }
        .alert-success { background: linear-gradient(135deg, #dcfce7, #bbf7d0); color: #166534; border: 1px solid #86efac; display: block; }
        .alert-error { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #991b1b; border: 1px solid #fca5a5; display: block; }
        .reg-number-box {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            margin: 15px 0 5px;
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            border: 2px dashed #8b5cf6;
            display: none;
        }
        .reg-number-box .label { font-size: 12px; color: #64748b; font-weight: normal; display: block; margin-bottom: 3px; }
        .reg-number-box .number { color: #6d28d9; font-size: 24px; letter-spacing: 1px; }
        .counter { text-align: center; font-size: 13px; color: #94a3b8; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
        .counter span { font-weight: bold; color: #6d28d9; }
        .footer-text { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 8px; }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .sync-status { font-size: 12px; color: #64748b; text-align: center; margin-top: 5px; }
        .sync-status .success { color: #16a34a; }
        .sync-status .error { color: #ef4444; }
        .sync-status .loading { color: #8b5cf6; }
        @media (max-width: 480px) {
            .container { padding: 18px 14px; }
            .vibrant-icon { width: 70px; height: 70px; }
            .vibrant-icon::before { width: 64px; height: 64px; }
            .vibrant-icon::after { width: 50px; height: 50px; }
            .icon-wrestle { font-size: 28px; }
            .icon-stars { font-size: 14px; }
            .icon-nbc { font-size: 9px; }
            .club-name { font-size: 16px; }
        }
        .options-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .option-card {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            transition: 0.3s;
            cursor: pointer;
        }
        .option-card:hover {
            border-color: #8b5cf6;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
        }
        .option-card .option-icon { font-size: 40px; text-align: center; display: block; margin-bottom: 10px; }
        .option-card .option-title { font-size: 18px; font-weight: 700; color: #1e293b; text-align: center; margin-bottom: 5px; }
        .option-card .option-desc { font-size: 13px; color: #64748b; text-align: center; }
        .login-box { max-width: 420px; margin: 0 auto; padding: 10px 0; }
        .login-box .input-group { margin-bottom: 15px; text-align: right; }
        .login-box .input-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #334155; font-size: 13px; }
        .login-box .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.3s;
            direction: ltr;
        }
        .login-box .input-group input:focus {
            border-color: #8b5cf6;
            outline: none;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
            background: white;
        }
        .login-title { text-align: center; color: #1e293b; margin-bottom: 5px; font-size: 22px; }
        .login-sub { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .login-error { text-align: center; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; font-size: 14px; }
        .login-error.show { display: block; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .player-dashboard { padding: 10px 0; }
        .player-dashboard .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin: 15px 0 10px;
            border-right: 4px solid #8b5cf6;
            padding-right: 10px;
        }
        .player-dashboard .info-card {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
        }
        .player-dashboard .info-card .label { font-size: 11px; color: #94a3b8; font-weight: 600; }
        .player-dashboard .info-card .value { font-size: 15px; font-weight: 700; color: #1e293b; }
        .absence-table-wrapper {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .absence-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            min-width: 700px;
            direction: rtl;
        }
        .absence-table th {
            background: #1e293b;
            color: white;
            padding: 6px 4px;
            text-align: center;
            font-weight: 600;
            font-size: 10px;
            white-space: nowrap;
        }
        .absence-table td {
            padding: 4px 3px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            font-size: 10px;
            font-weight: 600;
        }
        .absence-table tr:nth-child(even) td { background: #f8fafc; }
        .absence-table .status-present { background: #dcfce7 !important; color: #166534; border-bottom: 2px solid #16a34a; }
        .absence-table .status-absent { background: #fee2e2 !important; color: #991b1b; border-bottom: 2px solid #dc2626; }
        .absence-table .status-excused { background: #fef9c3 !important; color: #854d0e; border-bottom: 2px solid #d97706; }
        .absence-table .status-sick { background: #fce4ec !important; color: #9a1b3a; border-bottom: 2px solid #9a1b3a; }
        .absence-table .status-empty { background: #f1f5f9 !important; color: #94a3b8; }
        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 8px 12px;
            background: #f1f5f9;
            border-radius: 8px;
            margin: 8px 0 12px;
            font-size: 11px;
        }
        .legend .item { display: flex; align-items: center; gap: 4px; }
        .legend .color-box { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #e2e8f0; }
        .legend .color-box.present { background: #dcfce7; }
        .legend .color-box.absent { background: #fee2e2; }
        .legend .color-box.excused { background: #fef9c3; }
        .legend .color-box.sick { background: #fce4ec; }
        .legend .color-box.empty { background: #f1f5f9; }
        .player-dashboard .note-item {
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 6px;
            border-right: 3px solid #8b5cf6;
        }
        .player-dashboard .note-item .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .player-dashboard .note-item .note-date { font-size: 11px; color: #94a3b8; }
        .player-dashboard .note-item .note-text { color: #1e293b; font-size: 14px; }
        .player-dashboard .note-item .note-coach { font-size: 11px; color: #8b5cf6; font-weight: 600; }
        .readonly-message {
            background: #dbeafe;
            border-radius: 8px;
            padding: 10px 14px;
            margin: 10px 0;
            font-size: 13px;
            color: #1e40af;
            text-align: center;
            border: 1px solid #93c5fd;
        }
        .readonly-message .icon { font-size: 20px; display: inline-block; margin-left: 8px; }
        .tournament-card {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-right: 4px solid #f59e0b;
        }
        .tournament-card .title { font-weight: 700; color: #1e293b; font-size: 14px; }
        .tournament-card .meta { font-size: 12px; color: #64748b; }
        .tournament-card .type {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        .tournament-card .type.national { background: #dbeafe; color: #1e40af; }
        .tournament-card .type.regional { background: #dcfce7; color: #166534; }
        .empty-state { text-align: center; padding: 20px; color: #94a3b8; font-size: 14px; }
        .empty-state .icon { font-size: 40px; display: block; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="wrestling-bg">
    <div class="border-pattern top"></div>
    <div class="border-pattern bottom"></div>
    <div class="bg-icons">
        <span>🤼</span><span>⭐</span><span>🔥</span><span>🏛️</span>
        <span>⚔️</span><span>🛡️</span><span>⭐</span><span>🤼</span>
    </div>
</div>

<div class="container" id="appContainer">
    <div class="club-header">
        <div class="club-logo">
            <div class="vibrant-icon">
                <div class="icon-content">
                    <div class="icon-stars">⭐ ✦ ⭐</div>
                    <div class="icon-wrestle">🤼</div>
                    <div class="icon-nbc">NBC</div>
                </div>
            </div>
        </div>
        <div class="club-name">
            نجوم بلدية <span class="highlight">شي</span><span class="gold">حاني</span>
        </div>
        <div class="club-sub">
            <span class="accent">⚡</span> NOUJOUM BALADIAT CHIHAN <span class="accent">⚡</span>
        </div>
        <div class="club-sub2">🏛️ WRESTLING CLUB 🏛️</div>
    </div>
    
    <div class="divider">
        <span class="line"></span>
        <span class="icon">⚔️</span>
        <span class="line"></span>
    </div>
    
    <div class="ring-decoration">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <!-- ============================================================ -->
    <!-- الصفحة الرئيسية -->
    <!-- ============================================================ -->
    <div id="mainPage">
        <h2 style="text-align:center; color:#1e293b; margin-bottom:10px; font-size:20px;">🏅 منصة المصارعين</h2>
        <p style="text-align:center; color:#64748b; font-size:13px; margin-bottom:20px;">اختر أحد الخيارات التالية</p>
        
        <div class="option-card" onclick="showRegisterForm()">
            <span class="option-icon">📝</span>
            <div class="option-title">تسجيل جديد</div>
            <div class="option-desc">للمصارعين الجدد الذين يريدون الانضمام إلى النادي</div>
        </div>
        
        <div class="option-card" onclick="showLoginForm()">
            <
